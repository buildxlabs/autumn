[workspace]
members  = [ "crates/*" ]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "GPL-3.0-only"
rust-version = "1.100"
version      = "0.1.0"

[workspace.dependencies]
anyhow             = "1.0"
directories        = "6.0"
gpui-kit           = "=0.10.0"
serde              = { features = [ "derive" ], version = "1.0" }
serde_json         = "1.0"
tempfile           = "3.27"
thiserror          = "2.0"
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { features = [ "env-filter" ], version = "0.3" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto           = true
strip         = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }
unreachable_pub               = "warn"
unsafe_op_in_unsafe_fn        = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
expect_used            = "deny"
indexing_slicing       = "deny"
missing_assert_message = "warn"
missing_errors_doc     = "warn"
missing_panics_doc     = "warn"
panic                  = "deny"
panic_in_result_fn     = "warn"
string_slice           = "deny"
todo                   = "deny"
unimplemented          = "deny"
unreachable            = "deny"
unwrap_used            = "deny"

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# Unsafe must be justified.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks    = "warn"

# Async & Concurrency Footguns
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future     = "deny"

# API shape.
clone_on_ref_ptr          = "warn"
exhaustive_enums          = "warn"
fn_params_excessive_bools = "warn"
rc_buffer                 = "warn"
redundant_clone           = "warn"
struct_excessive_bools    = "warn"

# Idioms.
string_add       = "warn"
wildcard_imports = "warn"

# Output and debugging leftovers.
dbg_macro    = "deny"
print_stderr = "deny"
print_stdout = "deny"

# Casts that silently lose information.
as_conversions           = "warn"
cast_possible_truncation = "warn"
cast_sign_loss           = "warn"

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
enum_glob_use           = "allow"
module_inception        = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
