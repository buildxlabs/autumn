[package]
name                   = "autumn"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
version.workspace      = true
publish                = false

[lints]
workspace = true

[dependencies]
anyhow.workspace             = true
auth.workspace               = true
db                           = { path = "../db" }
domain.workspace             = true
engine.workspace             = true
gpui-kit.workspace           = true
metadata.workspace           = true
net.workspace                = true
player.workspace             = true
settings                     = { path = "../settings" }
tokio                        = { features = [ "io-util", "rt-multi-thread" ], workspace = true }
torrent.workspace            = true
tracing.workspace            = true
tracing-appender.workspace   = true
tracing-subscriber.workspace = true
tracker.workspace            = true
ui-screens.workspace         = true
ui-state.workspace           = true
ui-theme.workspace           = true

[dev-dependencies]
axum.workspace       = true
gpui-kit             = { features = [ "test-support" ], workspace = true }
serde_json.workspace = true
tempfile.workspace   = true
tokio                = { features = [ "macros", "rt" ], workspace = true }
ui-state             = { features = [ "test-util" ], workspace = true }
