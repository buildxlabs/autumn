# typos: prose spell-checking for the docs and source comments.
[files]
extend-exclude = [
  ".agents",
  ".claude",
  ".direnv",
  ".git",
  ".vite-hooks/_",
  "node_modules",
  "reference",
  # Recorded API responses: CDN hashes and foreign names, not prose.
  "**/tests/fixtures",
  "target",
]

[default.extend-words]
# ADN (Anime Digital Network), a source tag in release names.
adn = "adn"
# The suffix of ordinals such as 2nd, as in "2nd Season".
nd = "nd"
